<body>

<section id="loginPage" class="login">
  <div class="loginbox">

<div id="toast" class="toast hidden"></div>

<script>
"use strict";

/* ================================================
   1. SUPABASE CONFIGURATION
================================================ */

const SUPABASE_URL =
  "https://rumtkbyswizttypfrgqg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_u7km6UiSDYSaRtRftTholg_wDAuodyk";

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* ================================================
   2. APPLICATION STATE
================================================ */

let authUser = null;
let profile = null;
let currentPage = "dashboard";

let inbound = [];
let outbound = [];
let master = [];
let uploads = [];
let audit = [];
let profiles = [];

let editing = null;
let realtimeChannel = null;
let realtimeRefreshTimer = null;
let isInitializing = false;

let dash = {
  start: today(),
  end: today(),
  loader: "all"
};

let actFilter = {
  type: "all",
  start: "",
  end: ""
};

/* ================================================
   3. BASIC FUNCTIONS
================================================ */

function today() {
  const d = new Date();
  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
}

function esc(v) {
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function fmt(v) {
  return Number(v||0).toLocaleString("id-ID");
}

function dateFmt(v) {
  if(!v)return "-";
  const p=String(v).split("-");
  return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:v;
}

function norm(v) {
  return String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
}

function normalizeType(v) {
  const x=String(v||"").trim().toLowerCase();
  if(["inbound","in","ib"].includes(x))return "INBOUND";
  if(["outbound","out","ob"].includes(x))return "OUTBOUND";
  return "";
}

function databaseActivityType(v) {
  const type=normalizeType(v);
  if(type==="INBOUND")return "Inbound";
  if(type==="OUTBOUND")return "Outbound";
  return null;
}

function notify(message) {
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.remove("hidden");
  setTimeout(()=>el.classList.add("hidden"),3500);
}

function setSync(message) {
  document.getElementById("syncStatus").textContent=message;
}

function isAdmin() {
  return profile?.role==="admin";
}

function isSPV() {
  return profile?.role==="spv";
}

function isLoader() {
  return profile?.role==="loader";
}

function isManager() {
  return isAdmin()||isSPV();
}

function loaderName(id) {
  const p=profiles.find(x=>x.id===id);
  return p?.full_name||p?.username||"Loader";
}function allowedPages() {
  if(isAdmin())
    return ["dashboard","master","activities","reports","audit"];

  if(isSPV())
    return ["dashboard","activities","reports","audit"];

  if(isLoader())
    return ["activities"];

  return [];
}

/* ================================================
   4. AUTHENTICATION
================================================ */

async function login() {
  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPass").value;

  const error=document.getElementById("loginError");
  error.textContent="";

  if(!email||!password) {
    error.textContent="Email dan password wajib diisi.";
    return;
  }

  try {
    const {data,error:err}=await sb.auth.signInWithPassword({
      email,
      password
    });

    if(err)throw err;

    authUser=data.user;
    await initializeApp();

  } catch(e) {
    error.textContent=e.message;
  }
}

async function logout() {
  if(realtimeRefreshTimer) {
    clearTimeout(realtimeRefreshTimer);
    realtimeRefreshTimer=null;
  }
  if(realtimeChannel) {
    await sb.removeChannel(realtimeChannel);
    realtimeChannel=null;
  }

  await sb.auth.signOut();

  authUser=null;
  profile=null;

  document.getElementById("appPage").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("loginPass").value="";
}

async function initializeApp() {
  if(isInitializing)return;
  isInitializing=true;

  try {
  const {data,error}=await sb
    .from("profiles")
    .select("*")
    .eq("id",authUser.id)
    .single();

  if(error)throw error;

  profile=data;

  if(!profile.is_active) {
    await logout();
    throw new Error("Akun tidak aktif. Hubungi Administrator.");
  }

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("appPage").classList.remove("hidden");

  document.getElementById("userLabel").textContent=
    profile.full_name+" | "+profile.role.toUpperCase();

  await loadAll();

  if(isLoader()) {
    navigate("activities");
  } else {
    navigate("dashboard");
  }

  setupRealtime();
  } finally {
    isInitializing=false;
  }
}

sb.auth.onAuthStateChange((event)=>{
  if(event==="SIGNED_OUT") {
    if(realtimeChannel) {
      sb.removeChannel(realtimeChannel);
      realtimeChannel=null;
    }
    authUser=null;
    profile=null;
    document.getElementById("appPage").classList.add("hidden");
    document.getElementById("loginPage").classList.remove("hidden");
    document.getElementById("loginPass").value="";
  }
});

/* ================================================
   5. LOAD DATABASE
================================================ */

async function loadAll() {
  setSync("Loading database...");

  const tasks=[
    sb.from("profiles").select("id,full_name,username,role,is_active"),
    sb.from("inbound_activities").select("*").order("activity_date",{ascending:false}),
    sb.from("outbound_activities").select("*").order("activity_date",{ascending:false}),
    sb.from("excel_reference_rows").select("*"),
    sb.from("excel_uploads").select("*").order("created_at",{ascending:false})
  ];

  const results=await Promise.all(tasks);

  for(const r of results) {
    if(r.error)throw r.error;
  }

  profiles=results[0].data||[];
  inbound=results[1].data||[];
  outbound=results[2].data||[];
  master=results[3].data||[];
  uploads=results[4].data||[];

  if(isManager()) {
    const a=await sb.from("audit_logs")
      .select("*")
      .order("created_at",{ascending:false})
      .limit(500);

    if(!a.error)audit=a.data||[];
  }

  setSync("● Connected to Supabase");
}

async function refreshData() {
  try {
    await loadAll();
    render();
  } catch(e) {
    console.error(e);
    notify("Gagal refresh: "+e.message);
  }
}

/* ================================================
   6. REALTIME
================================================ */

function scheduleRealtimeRefresh() {
  if(realtimeRefreshTimer)clearTimeout(realtimeRefreshTimer);
  realtimeRefreshTimer=setTimeout(()=>{
    realtimeRefreshTimer=null;
    refreshData();
  },300);
}

function setupRealtime() {
  if(realtimeChannel) {
    sb.removeChannel(realtimeChannel);
    realtimeChannel=null;
  }

  realtimeChannel=sb.channel("loaderops-live-"+authUser.id);

  [
    "inbound_activities",
    "outbound_activities",
    "excel_reference_rows",
    "excel_uploads",
    "profiles",
    "audit_logs"
  ].forEach(table=>{
    realtimeChannel.on(
      "postgres_changes",
      {event:"*",schema:"public",table},
      scheduleRealtimeRefresh
    );
  });

  realtimeChannel.subscribe(status=>{
    if(status==="SUBSCRIBED") {
      setSync("● Realtime connected — perubahan perangkat lain aktif");
    } else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT") {
      setSync("Realtime terputus — gunakan tombol Refresh");
      console.warn("Supabase Realtime status:",status);
    } else if(status==="CLOSED") {
      setSync("Realtime tidak aktif");
    }
  });
}

/* ================================================
   7. NAVIGATION
================================================ */

function navigate(page) {
  if(!allowedPages().includes(page))
    page=isLoader()?"activities":"dashboard";

  currentPage=page;

  const labels={
    dashboard:"📊 Dashboard",
    master:"📁 Upload Master Data",
    activities:"📋 Aktivitas Loader",
    reports:"📈 Laporan",
    audit:"🕒 Audit Log"
  };

  document.getElementById("navigation").innerHTML=
    allowedPages().map(p=>`
      <button class="${p===page?"active":""}"
        onclick="navigate('${p}')">
        ${labels[p]}
      </button>
    `).join("");

  render();
}

function render() {
  if(currentPage==="dashboard")renderDashboard();
  if(currentPage==="master")renderMaster();
  if(currentPage==="activities")renderActivities();
  if(currentPage==="reports")renderReports();
  if(currentPage==="audit")renderAudit();
}

/* ================================================
   8. MASTER VALIDATION
================================================ */

function activityType(row) {
  return normalizeType(row.activity_type);
}

function masterMatches(type,date,number) {
  return master.filter(m=>
    activityType(m)===type &&
    m.activity_date===date &&
    (
      type==="INBOUND"
        ? norm(m.vehicle_number)===norm(number)
        : norm(m.container_number||m.vehicle_number)===norm(number)
    )
  );
}

function validateActivity(type,row) {
  const number=type==="INBOUND"
    ? row.vehicle_number
    : row.container_number;

  const matches=masterMatches(
    type,row.activity_date,number
  );

  if(!matches.length) {
    return {
      status:"Belum Dicocokkan",
      qty:null,
      difference:null,
      match:null
    };
  }

  const expected=matches.reduce(
    (s,m)=>s+Number(m.total_carton||0),0
  );

  const difference=Number(row.total_carton)-expected;

  return {
    status:difference===0?"Sesuai":"Tidak Sesuai",
    qty:expected,
    difference,
    match:matches[0]
  };
}

function tag(status) {
  const cls=status==="Sesuai"?"ok":
    status==="Tidak Sesuai"?"bad":"wait";

  return `<span class="tag ${cls}">${esc(status)}</span>`;
}

function allActivities() {
  const a=inbound.map(x=>({
    ...x,type:"INBOUND",
    number:x.vehicle_number
  }));

  const b=outbound.map(x=>({
    ...x,type:"OUTBOUND",
    number:x.container_number
  }));

  return [...a,...b].sort((x,y)=>
    y.activity_date.localeCompare(x.activity_date)
  );
}

function visibleActivities() {
  let rows=allActivities();

  if(isLoader())
    rows=rows.filter(x=>x.loader_id===authUser.id);

  if(actFilter.type!=="all")
    rows=rows.filter(x=>x.type===actFilter.type);

  if(actFilter.start)
    rows=rows.filter(x=>x.activity_date>=actFilter.start);

  if(actFilter.end)
    rows=rows.filter(x=>x.activity_date<=actFilter.end);

  return rows;
}

/* ================================================
   9. DASHBOARD
================================================ */

function kpi(name,value,sub) {
  return `
    <div class="kpi">
      <div class="name">${esc(name)}</div>
      <div class="value">${fmt(value)}</div>
      <div class="sub">${esc(sub)}</div>
    </div>
  `;
}

function renderDashboard() {
  if(!isManager())return;

  let rows=allActivities().filter(a=>
    a.activity_date>=dash.start&&
    a.activity_date<=dash.end
  );

  if(dash.loader!=="all")
    rows=rows.filter(a=>a.loader_id===dash.loader);

  const total=rows.reduce((s,a)=>s+Number(a.total_carton),0);
  const ins=rows.filter(a=>a.type==="INBOUND");
  const outs=rows.filter(a=>a.type==="OUTBOUND");

  const valid=rows.filter(a=>
    validateActivity(a.type,a).status==="Sesuai"
  ).length;

  const invalid=rows.filter(a=>
    validateActivity(a.type,a).status==="Tidak Sesuai"
  ).length;

  const pending=rows.length-valid-invalid;

  const loaderIds=[...new Set(rows.map(a=>a.loader_id))];

  document.getElementById("content").innerHTML=`
    <section class="panel">
      <h3>Dashboard Operasional</h3>

      <div class="filters no-print">
        <div class="field">
          <label>Tanggal Mulai</label>
          <input type="date" id="dashStart" value="${dash.start}">
        </div>
        <div class="field">
          <label>Tanggal Akhir</label>
          <input type="date" id="dashEnd" value="${dash.end}">
        </div>
        <div class="field">
          <label>Loader</label>
          <select id="dashLoader">
            <option value="all">Semua Loader</option>
            ${profiles.filter(p=>p.role==="loader").map(p=>`
              <option value="${p.id}" ${dash.loader===p.id?"selected":""}>
                ${esc(p.full_name)}
              </option>
            `).join("")}
          </select>
        </div>
        <div class="field">
          <button class="btn" onclick="applyDash()">Terapkan Filter</button>
        </div>
      </div>

      <p class="muted">
        Periode ${dateFmt(dash.start)} sampai ${dateFmt(dash.end)}
      </p>
    </section>

    <div class="cards">
      ${kpi("Total Aktivitas",rows.length,"Transaksi")}
      ${kpi("Total Carton",total,"Carton")}
      ${kpi("Inbound",ins.reduce((s,a)=>s+Number(a.total_carton),0),"Carton")}
      ${kpi("Outbound",outs.reduce((s,a)=>s+Number(a.total_carton),0),"Carton")}
    </div>

    <div class="cards">
      ${kpi("Sesuai Master",valid,"Transaksi")}
      ${kpi("Tidak Sesuai",invalid,"Perlu pemeriksaan")}
      ${kpi("Belum Dicocokkan",pending,"Belum ada referensi")}
      ${kpi("Master Data",master.length,"Baris referensi")}
    </div>

    <section class="panel">
      <h3>Performa Carton per Loader</h3>
      <div class="legend">
        <span><i class="dot blue"></i>Inbound</span>
        <span><i class="dot orange"></i>Outbound</span>
      </div>
      ${loaderIds.length?loaderIds.map(id=>{
        const name=loaderName(id);
        const iv=rows.filter(a=>a.loader_id===id&&a.type==="INBOUND")
          .reduce((s,a)=>s+Number(a.total_carton),0);
        const ov=rows.filter(a=>a.loader_id===id&&a.type==="OUTBOUND")
          .reduce((s,a)=>s+Number(a.total_carton),0);
        const max=Math.max(iv,ov,1);

        return `
          <div style="margin-top:20px">
            <b>${esc(name)}</b>
            <div class="chartrow">
              <span>Inbound</span>
              <div class="track"><div class="bar blue" style="width:${iv/max*100}%"></div></div>
              <b>${fmt(iv)}</b>
            </div>
            <div class="chartrow">
              <span>Outbound</span>
              <div class="track"><div class="bar orange" style="width:${ov/max*100}%"></div></div>
              <b>${fmt(ov)}</b>
            </div>
          </div>
        `;
      }).join(""):'<p class="muted">Belum ada aktivitas.</p>'}
    </section>

    <section class="panel">
      <h3>Aktivitas Terbaru</h3>
      ${activityTable(rows.slice(0,30))}
    </section>
  `;
}

function applyDash() {
  dash.start=document.getElementById("dashStart").value;
  dash.end=document.getElementById("dashEnd").value;
  dash.loader=document.getElementById("dashLoader").value;

  if(dash.start>dash.end) {
    notify("Tanggal mulai tidak boleh melewati tanggal akhir.");
    return;
  }
  renderDashboard();
}/* ================================================
   12. MASTER CSV UPLOAD
================================================ */

function parseDate(value) {
  if(value===null||value===undefined||value==="")return "";

  if(typeof value==="number") {
    const d=new Date(Date.UTC(1899,11,30)+Math.floor(value)*86400000);
    return d.toISOString().slice(0,10);
  }

  const s=String(value).trim();

  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;

  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m)return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;

  const d=new Date(s);
  if(!isNaN(d)) {
    return d.getFullYear()+"-"+
      String(d.getMonth()+1).padStart(2,"0")+"-"+
      String(d.getDate()).padStart(2,"0");
  }

  return "";
}

function headerIndex(headers,aliases) {
  return headers.findIndex(h=>aliases.includes(
    String(h).toLowerCase().trim().replace(/[\s_-]+/g,"")
  ));
}

async function uploadMaster() {
  if(!isAdmin())return;

  const file=document.getElementById("masterFile").files[0];
  const mode=document.getElementById("masterMode").value;

  if(!file)return notify("Pilih file CSV terlebih dahulu.");

  try {
    const parsed=Papa.parse(await file.text(),{
      header:true,
      skipEmptyLines:true,
      transformHeader:h=>h.trim()
    });

    if(parsed.errors.length)
      throw new Error(parsed.errors[0].message);

    const rows=parsed.data;
    if(!rows.length)throw new Error("File tidak memiliki data.");

    const headers=Object.keys(rows[0]);

    const di=headerIndex(headers,["tanggal","date"]);
    const ti=headerIndex(headers,["jenis","type","aktivitas","jenisaktivitas"]);
    const ni=headerIndex(headers,["nomor","nomobil","nocontainer","referensi","nopol"]);
    const qi=headerIndex(headers,["qty","carton","qtycarton","totalcarton","totalqtycarton"]);

    if([di,ti,ni,qi].includes(-1))
      throw new Error("Header wajib: TANGGAL, JENIS, NOMOR, QTY.");

    const grouped=new Map();

    rows.forEach((row,i)=>{
      const date=parseDate(row[headers[di]]);
      const type=normalizeType(row[headers[ti]]);
      const number=String(row[headers[ni]]||"").trim().toUpperCase();
      const qty=Number(String(row[headers[qi]]??"").replace(/,/g,""));

      if(!date||!type||!number||!Number.isSafeInteger(qty)||qty<0)
        throw new Error("Data tidak valid pada baris "+(i+2));

      const key=[date,type,norm(number)].join("|");

      if(!grouped.has(key)) {
        grouped.set(key,{
          activity_date:date,
          activity_type:databaseActivityType(type),
          vehicle_number:number,
          container_number:type==="OUTBOUND"?number:null,
          total_carton:0
        });
      }

      grouped.get(key).total_carton+=qty;
    });

    const imported=[...grouped.values()];
    if(!imported.length)throw new Error("Tidak ada baris valid.");

    const start=imported.map(x=>x.activity_date).sort()[0];
    const end=imported.map(x=>x.activity_date).sort().at(-1);

    if(mode==="replace") {
      if(!confirm("Ganti master pada periode "+dateFmt(start)+" sampai "+dateFmt(end)+"?"))return;
    }

    const upload=await sb.from("excel_uploads").insert({
      file_name:file.name,
      period_start:start,
      period_end:end,
      upload_status:"Diproses",
      total_rows:imported.length,
      upload_note:"Upload melalui LoaderOPS",
      uploaded_by:authUser.id
    }).select().single();

    if(upload.error)throw upload.error;

    if(mode==="replace") {
      const del=await sb.from("excel_reference_rows")
        .delete()
        .gte("activity_date",start)
        .lte("activity_date",end);

      if(del.error)throw del.error;
    }

    const batch=imported.map(x=>({
      ...x,
      upload_id:upload.data.id
    }));

    for(let i=0;i<batch.length;i+=500) {
      const part=batch.slice(i,i+500);
      const inserted=await sb.from("excel_reference_rows").insert(part);

      if(inserted.error) {
        await sb.from("excel_uploads")
          .update({upload_status:"Gagal",upload_note:inserted.error.message})
          .eq("id",upload.data.id);
        throw inserted.error;
      }
    }

    await sb.from("excel_uploads")
      .update({upload_status:"Berhasil"})
      .eq("id",upload.data.id);

    await loadAll();
    notify("Master berhasil diupload: "+imported.length+" nomor unik.");
    renderMaster();

  } catch(e) {
    console.error(e);
    notify("Upload gagal: "+e.message);
  }
}

/* ================================================
   16. EXPORT CSV
================================================ */

function downloadCSV(filename,headers,rows) {
  const cell=v=>'"'+String(v??"").replace(/"/g,'""')+'"';

  const csv="\uFEFF"+
    [headers,...rows].map(r=>r.map(cell).join(",")).join("\r\n");

  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download=filename;
  a.click();

  URL.revokeObjectURL(url);
}

function exportMaster() {
  downloadCSV(
    "loaderops_master.csv",
    ["Tanggal","Jenis","Nomor","Total Carton"],
    master.map(m=>[
      m.activity_date,
      activityType(m),
      activityType(m)==="INBOUND"
        ?m.vehicle_number
        :(m.container_number||m.vehicle_number),
      m.total_carton
    ])
  );
}

function exportReport() {
  const rows=allActivities().filter(a=>
    a.activity_date>=dash.start&&
    a.activity_date<=dash.end&&
    (dash.loader==="all"||a.loader_id===dash.loader)
  );

  downloadCSV(
    "loaderops_report.csv",
    ["Tanggal","Loader","Jenis","Nomor","Qty Loader","Qty Master","Selisih","Status"],
    rows.map(a=>{
      const v=validateActivity(a.type,a);
      return [
        a.activity_date,
        loaderName(a.loader_id),
        a.type,
        a.number,
        a.total_carton,
        v.qty??"",
        v.difference??"",
        v.status
      ];
    })
  );
}
