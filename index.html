
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoaderOPS | Warehouse Dashboard</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#243448;background:#f3f6fb}
*{box-sizing:border-box}
body{margin:0}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#102c50,#2171ba)}
.login-box{background:white;padding:34px;border-radius:18px;width:min(420px,100%);box-shadow:0 18px 50px #0003}
.login-box h1{margin:0;color:#1261a6}
.login-box p{color:#68778a}
label{font-size:13px;font-weight:bold;display:block;margin-bottom:6px}
input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:white}
.field{margin-bottom:15px}
.btn{border:0;border-radius:8px;padding:10px 15px;background:#1769aa;color:white;font-weight:bold}
.btn:hover{filter:brightness(.94)}
.btn.gray{background:#64748b}
.btn.red{background:#c33b44}
.btn.green{background:#16815e}
.btn.light{background:#e7eef7;color:#244466}
.btn:disabled{opacity:.5;cursor:not-allowed}
header{background:#12345a;color:white;padding:17px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h2{margin:0}
header small{color:#d7e6f5}
nav{background:white;display:flex;gap:7px;padding:12px 20px;flex-wrap:wrap;border-bottom:1px solid #dce5ef}
nav button{background:#edf3fa;color:#31516f;border:0;border-radius:8px;padding:10px 13px;font-weight:bold}
nav button.active{background:#1769aa;color:white}
main{max-width:1350px;margin:auto;padding:22px}
.panel{background:white;border:1px solid #e1e8f0;border-radius:13px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px #193c6008}
.panel h3{margin:0 0 15px}
.filters{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px;align-items:end}
.cards{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:13px;margin-bottom:18px}
.kpi{background:white;border:1px solid #e0e8f0;border-radius:12px;padding:17px}
.kpi .name{font-size:13px;color:#68798b}
.kpi .value{font-size:27px;font-weight:800;color:#173d67;margin-top:8px}
.kpi .sub{font-size:12px;color:#8794a3;margin-top:5px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;border-bottom:1px solid #e8edf4;padding:11px;white-space:nowrap}
th{background:#f0f5fa;color:#456079}
tr:hover td{background:#fafcff}
.tag{display:inline-block;padding:5px 9px;border-radius:30px;font-size:12px;font-weight:bold}
.ok{background:#def6e8;color:#12643c}
.bad{background:#ffe4e4;color:#a32935}
.wait{background:#fff1cd;color:#8b6500}
.muted{color:#708092;font-size:13px}
.toolbar{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:12px}
.form-actions{display:flex;gap:8px;margin-top:15px}
.chart-row{display:grid;grid-template-columns:120px 1fr 75px;gap:12px;align-items:center;margin:11px 0}
.track{height:13px;background:#edf1f7;border-radius:20px;overflow:hidden}
.bar{height:100%;border-radius:20px}
.blue{background:#287bd1}
.orange{background:#f5a23a}
.legend{display:flex;gap:16px;margin-bottom:14px;font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
hr{border:0;border-top:1px solid #e7edf4;margin:20px 0}
.notice{background:#eaf3fc;color:#315a81;border-radius:9px;padding:12px;font-size:13px;margin-bottom:15px}
.error{background:#ffe9e9;color:#a22d37}
.success{background:#e3f8eb;color:#176440}
@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.filters,.form-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.cards,.filters,.form-grid{grid-template-columns:1fr}main{padding:12px}.chart-row{grid-template-columns:75px 1fr 65px}}
@media print{header,nav,.toolbar,.filters,.no-print{display:none!important}main{padding:0}.panel,.kpi{box-shadow:none}}
</style>
</head>
<body>

<section id="loginPage" class="login-wrap">
  <div class="login-box">
    <h1>LoaderOPS</h1>
    <p>Warehouse Operational Dashboard · Demo</p>
    <div class="field">
      <label>Username</label>
      <select id="loginUser">
        <option value="admin">Admin</option>
        <option value="spv">Supervisor (SPV)</option>
        <option value="mijan">Mijan</option>
        <option value="ompong">Ompong</option>
        <option value="safar">Safar</option>
      </select>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Masukkan password">
    </div>
    <button class="btn" style="width:100%" onclick="login()">Login</button>
    <p class="muted">Password demo: <b>demo123</b></p>
    <p id="loginError" style="color:#b91c1c"></p>
  </div>
</section>

<section id="appPage" class="hidden">
  <header>
    <div>
      <h2>📦 LoaderOPS</h2>
      <small>Warehouse Operational Monitoring System</small>
    </div>
    <div>
      <span id="userLabel"></span>
      <button class="btn gray" onclick="logout()" style="margin-left:12px">Logout</button>
    </div>
  </header>
  <nav id="navigation"></nav>
  <main id="content"></main>
</section>

<script>
"use strict";

const STORAGE_KEY = "loaderops_master_dashboard_v1";
const USERS = ["admin","spv","mijan","ompong","safar"];
const LOADERS = ["mijan","ompong","safar"];

let currentUser = sessionStorage.getItem("loaderops_user") || "";
let currentPage = "dashboard";
let db = loadDatabase();

let dashboardFilter = {
  start: localDate(),
  end: localDate(),
  loader: "all"
};

let activityFilter = {
  type: "all",
  start: "",
  end: ""
};

function localDate(date = new Date()){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

function normalizeNumber(value){
  return String(value ?? "").toUpperCase().replace(/[^A-Z0-9]/g,"");
}

function normalizeType(value){
  const x = String(value ?? "").trim().toLowerCase();
  if(["inbound","in","ib"].includes(x)) return "Inbound";
  if(["outbound","out","ob"].includes(x)) return "Outbound";
  return "";
}

function formatQty(value){
  return Number(value || 0).toLocaleString("id-ID");
}

function formatDate(value){
  if(!value) return "-";
  const p = value.split("-");
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : value;
}

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,9);
}

function defaultDatabase(){
  return {master:[],activities:[],audit:[]};
}

function loadDatabase(){
  try{
    const x = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(x && Array.isArray(x.master) && Array.isArray(x.activities)){
      return {...defaultDatabase(),...x};
    }
  }catch(e){}
  return defaultDatabase();
}

function saveDatabase(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
}

function logAction(action,detail){
  db.audit.unshift({
    id:uid(),
    at:new Date().toLocaleString("id-ID"),
    user:currentUser,
    action,
    detail
  });
  db.audit = db.audit.slice(0,500);
}

function login(){
  const username = document.getElementById("loginUser").value;
  const password = document.getElementById("loginPass").value;
  if(password !== "demo123"){
    document.getElementById("loginError").textContent="Password salah.";
    return;
  }
  currentUser = username;
  sessionStorage.setItem("loaderops_user",username);
  showApp();
}

function logout(){
  currentUser = "";
  sessionStorage.removeItem("loaderops_user");
  document.getElementById("appPage").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("loginPass").value="";
}

function isManager(){
  return currentUser === "admin" || currentUser === "spv";
}

function showApp(){
  if(!USERS.includes(currentUser)){
    logout();
    return;
  }
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("appPage").classList.remove("hidden");
  document.getElementById("userLabel").textContent =
    currentUser.toUpperCase() + " | " +
    (currentUser==="admin"?"Administrator":currentUser==="spv"?"Supervisor":"Loader");
  navigate("dashboard");
}

function navigate(page){
  const allowed = ["dashboard","activities","reports"];
  if(currentUser==="admin") allowed.push("master","audit");
  if(currentUser==="spv") allowed.push("audit");
  if(!allowed.includes(page)) page="dashboard";
  currentPage=page;

  const labels = {
    dashboard:"📊 Dashboard",
    activities:"📋 Aktivitas Loader",
    master:"📁 Master Data",
    reports:"📈 Laporan",
    audit:"🕒 Audit Log"
  };

  document.getElementById("navigation").innerHTML =
    allowed.map(p=>`<button class="${p===page?"active":""}"
      onclick="navigate('${p}')">${labels[p]}</button>`).join("");

  render();
}

function render(){
  if(currentPage==="dashboard") renderDashboard();
  if(currentPage==="activities") renderActivities();
  if(currentPage==="master") renderMaster();
  if(currentPage==="reports") renderReports();
  if(currentPage==="audit") renderAudit();
}

function getValidation(activity){
  const matches = db.master.filter(m =>
    m.date === activity.date &&
    m.type === activity.type &&
    normalizeNumber(m.number) === normalizeNumber(activity.number)
  );

  if(!matches.length){
    return {
      status:"Belum Dicocokkan",
      masterQty:null,
      difference:null,
      note:"Nomor tidak ditemukan pada master"
    };
  }

  const master = matches[0];
  const diff = Number(activity.qty)-Number(master.qty);

  return {
    status:diff===0?"Sesuai":"Tidak Sesuai",
    masterQty:Number(master.qty),
    difference:diff,
    note:diff===0?"Cocok dengan master":"Selisih qty carton"
  };
}

function visibleActivities(){
  return isManager()
    ? db.activities
    : db.activities.filter(a=>a.loader===currentUser);
}

function inRange(date,start,end){
  return (!start || date>=start) && (!end || date<=end);
}

function statusTag(status){
  const cls = status==="Sesuai"?"ok":
    status==="Tidak Sesuai"?"bad":"wait";
  return `<span class="tag ${cls}">${esc(status)}</span>`;
}

function getDashboardRows(){
  return visibleActivities().filter(a =>
    inRange(a.date,dashboardFilter.start,dashboardFilter.end) &&
    (dashboardFilter.loader==="all" || a.loader===dashboardFilter.loader)
  );
}

function filterFields(){
  return `
    <div class="field">
      <label>Tanggal Mulai</label>
      <input type="date" id="dashStart" value="${esc(dashboardFilter.start)}">
    </div>
    <div class="field">
      <label>Tanggal Akhir</label>
      <input type="date" id="dashEnd" value="${esc(dashboardFilter.end)}">
    </div>
    <div class="field">
      <label>Loader</label>
      <select id="dashLoader" ${!isManager()?"disabled":""}>
        <option value="all">Semua Loader</option>
        ${LOADERS.map(x=>`<option value="${x}"
          ${dashboardFilter.loader===x?"selected":""}>${x.toUpperCase()}</option>`).join("")}
      </select>
    </div>
    <div class="field">
      <button class="btn" onclick="applyDashboardFilter()">Terapkan Filter</button>
      <button class="btn light" onclick="resetDashboardFilter()">Reset</button>
    </div>`;
}

function applyDashboardFilter(){
  const start=document.getElementById("dashStart").value;
  const end=document.getElementById("dashEnd").value;
  if(start && end && start>end){
    alert("Tanggal mulai tidak boleh melebihi tanggal akhir.");
    return;
  }
  dashboardFilter={
    start,end,
    loader:isManager()?document.getElementById("dashLoader").value:currentUser
  };
  renderDashboard();
}

function resetDashboardFilter(){
  dashboardFilter={
    start:localDate(),
    end:localDate(),
    loader:isManager()?"all":currentUser
  };
  renderDashboard();
}

function renderDashboard(){
  if(!isManager()) dashboardFilter.loader=currentUser;
  const rows=getDashboardRows();
  const inbound=rows.filter(a=>a.type==="Inbound");
  const outbound=rows.filter(a=>a.type==="Outbound");
  const sum=arr=>arr.reduce((s,a)=>s+Number(a.qty),0);

  const valid=rows.filter(a=>getValidation(a).status==="Sesuai").length;
  const invalid=rows.filter(a=>getValidation(a).status==="Tidak Sesuai").length;
  const pending=rows.length-valid-invalid;

  const names=isManager()
    ? (dashboardFilter.loader==="all"?LOADERS:[dashboardFilter.loader])
    : [currentUser];

  const performance=names.map(name=>{
    const data=rows.filter(a=>a.loader===name);
    return {
      name,
      inbound:sum(data.filter(a=>a.type==="Inbound")),
      outbound:sum(data.filter(a=>a.type==="Outbound")),
      count:data.length
    };
  });

  const max=Math.max(1,...performance.flatMap(x=>[x.inbound,x.outbound]));

  document.getElementById("content").innerHTML=`
    <div class="panel">
      <h3>Dashboard Operasional Warehouse</h3>
      <div class="filters">${filterFields()}</div>
      <p class="muted">Periode:
        ${dashboardFilter.start?formatDate(dashboardFilter.start):"Semua tanggal"}
        s.d.
        ${dashboardFilter.end?formatDate(dashboardFilter.end):"Semua tanggal"}
      </p>
    </div>

    <div class="cards">
      ${kpi("Total Aktivitas",rows.length,"Transaksi Inbound + Outbound")}
      ${kpi("Carton Inbound",sum(inbound),"Dari input Loader")}
      ${kpi("Carton Outbound",sum(outbound),"Dari input Loader")}
      ${kpi("Aktivitas Sesuai",valid,"Cocok dengan master")}
      ${kpi("Tidak Sesuai",invalid,"Perlu pemeriksaan")}
      ${kpi("Belum Dicocokkan",pending,"Master belum ditemukan")}
      ${kpi("Jumlah Inbound",inbound.length,"Aktivitas")}
      ${kpi("Jumlah Outbound",outbound.length,"Aktivitas")}
    </div>

    <div class="panel">
      <h3>📊 Performa Carton per Loader</h3>
      <p class="muted">Grafik menggunakan qty carton yang diinput Loader
        dan mengikuti filter tanggal serta nama Loader.</p>
      <div class="legend">
        <span><i class="dot blue"></i>Inbound</span>
        <span><i class="dot orange"></i>Outbound</span>
      </div>
      ${performance.map(x=>`
        <div style="margin-bottom:22px">
          <b>${esc(x.name.toUpperCase())}</b>
          <span class="muted">(${x.count} aktivitas)</span>
          ${chartBar("Inbound",x.inbound,max,"blue")}
          ${chartBar("Outbound",x.outbound,max,"orange")}
        </div>`).join("")}
      ${rows.length===0?'<p class="muted">Belum ada aktivitas pada periode ini.</p>':""}
    </div>

    <div class="panel">
      <h3>Status Validasi Aktivitas</h3>
      ${renderActivityTable(rows.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20),false)}
    </div>`;
}

function kpi(name,value,sub){
  return `<div class="kpi">
    <div class="name">${esc(name)}</div>
    <div class="value">${formatQty(value)}</div>
    <div class="sub">${esc(sub)}</div>
  </div>`;
}

function chartBar(label,value,max,color){
  const percent=value===0?0:Math.max(1,value/max*100);
  return `<div class="chart-row">
    <span class="muted">${label}</span>
    <div class="track"><div class="bar ${color}" style="width:${percent}%"></div></div>
    <b style="text-align:right">${formatQty(value)}</b>
  </div>`;
}

function renderActivities(){
  const rows=visibleActivities().filter(a=>
    (activityFilter.type==="all" || a.type===activityFilter.type) &&
    inRange(a.date,activityFilter.start,activityFilter.end)
  ).sort((a,b)=>b.date.localeCompare(a.date));

  document.getElementById("content").innerHTML=`
    <div class="panel">
      <div class="toolbar">
        <h3>Aktivitas Inbound & Outbound</h3>
        <button class="btn green" onclick="openActivityForm()">+ Input Aktivitas</button>
      </div>
      <div class="filters">
        <div class="field"><label>Jenis</label>
          <select id="actType">
            <option value="all">Semua</option>
            <option value="Inbound" ${activityFilter.type==="Inbound"?"selected":""}>Inbound</option>
            <option value="Outbound" ${activityFilter.type==="Outbound"?"selected":""}>Outbound</option>
          </select>
        </div>
        <div class="field"><label>Dari Tanggal</label>
          <input type="date" id="actStart" value="${esc(activityFilter.start)}">
        </div>
        <div class="field"><label>Sampai Tanggal</label>
          <input type="date" id="actEnd" value="${esc(activityFilter.end)}">
        </div>
        <div class="field">
          <button class="btn" onclick="applyActivityFilter()">Filter</button>
          <button class="btn light" onclick="resetActivityFilter()">Reset</button>
        </div>
      </div>
    </div>
    <div id="activityFormArea"></div>
    <div class="panel">
      <h3>Daftar Aktivitas (${rows.length})</h3>
      ${renderActivityTable(rows,true)}
    </div>`;
}

function applyActivityFilter(){
  const start=document.getElementById("actStart").value;
  const end=document.getElementById("actEnd").value;
  if(start && end && start>end){
    alert("Rentang tanggal tidak valid.");
    return;
  }
  activityFilter={
    type:document.getElementById("actType").value,
    start,end
  };
  renderActivities();
}

function resetActivityFilter(){
  activityFilter={type:"all",start:"",end:""};
  renderActivities();
}

function renderActivityTable(rows,actions){
  if(!rows.length) return '<p class="muted">Belum ada data aktivitas.</p>';

  return `<div class="table-wrap"><table>
    <thead><tr>
      <th>Tanggal</th><th>Loader</th><th>Jenis</th>
      <th>No. Mobil / Container</th><th>Qty Loader</th>
      <th>Qty Master</th><th>Selisih</th><th>Status</th>
      ${actions?"<th>Aksi</th>":""}
    </tr></thead>
    <tbody>${rows.map(a=>{
      const v=getValidation(a);
      const canEdit=isManager() || a.loader===currentUser;
      return `<tr>
        <td>${formatDate(a.date)}</td>
        <td>${esc(a.loader.toUpperCase())}</td>
        <td>${esc(a.type)}</td>
        <td>${esc(a.number)}</td>
        <td>${formatQty(a.qty)}</td>
        <td>${v.masterQty===null?"-":formatQty(v.masterQty)}</td>
        <td>${v.difference===null?"-":formatQty(v.difference)}</td>
        <td>${statusTag(v.status)}</td>
        ${actions?`<td>${canEdit?`
          <button class="btn light" onclick="openActivityForm('${a.id}')">Edit</button>
          <button class="btn red" onclick="deleteActivity('${a.id}')">Hapus</button>`:"-"}</td>`:""}
      </tr>`;
    }).join("")}</tbody>
  </table></div>`;
}

function openActivityForm(id=""){
  const a=id?db.activities.find(x=>x.id===id):null;
  if(id && !a) return;
  if(a && !isManager() && a.loader!==currentUser) return;

  const loader=a?.loader || (isManager()?LOADERS[0]:currentUser);

  document.getElementById("activityFormArea").innerHTML=`
    <div class="panel">
      <h3>${a?"Edit":"Tambah"} Aktivitas</h3>
      <div class="form-grid">
        <div class="field"><label>Tanggal</label>
          <input type="date" id="formDate" value="${esc(a?.date||localDate())}">
        </div>
        <div class="field"><label>Jenis Aktivitas</label>
          <select id="formType">
            <option value="Inbound" ${a?.type==="Inbound"?"selected":""}>Inbound</option>
            <option value="Outbound" ${a?.type==="Outbound"?"selected":""}>Outbound</option>
          </select>
        </div>
        <div class="field"><label>Loader</label>
          <select id="formLoader" ${!isManager()?"disabled":""}>
            ${LOADERS.map(x=>`<option value="${x}" ${loader===x?"selected":""}>${x.toUpperCase()}</option>`).join("")}
          </select>
        </div>
        <div class="field"><label>No. Mobil / Container</label>
          <input id="formNumber" value="${esc(a?.number||"")}" placeholder="Contoh B 9123 XYZ">
        </div>
        <div class="field"><label>Total Qty Carton</label>
          <input type="number" id="formQty" min="0" step="1" value="${a?.qty??""}">
        </div>
      </div>
      <p class="muted">Nomor mobil digunakan untuk Inbound.
        Nomor container digunakan untuk Outbound.</p>
      <div class="form-actions">
        <button class="btn green" onclick="saveActivity('${id}')">Simpan Aktivitas</button>
        <button class="btn gray" onclick="renderActivities()">Batal</button>
      </div>
    </div>`;
  document.getElementById("activityFormArea").scrollIntoView({behavior:"smooth"});
}

function saveActivity(id){
  const date=document.getElementById("formDate").value;
  const type=document.getElementById("formType").value;
  const number=document.getElementById("formNumber").value.trim().toUpperCase();
  const qtyText=document.getElementById("formQty").value;
  const qty=Number(qtyText);
  const loader=isManager()?document.getElementById("formLoader").value:currentUser;

  if(!date || !number || qtyText==="" ||
    !Number.isSafeInteger(qty) || qty<0){
    alert("Isi tanggal, nomor kendaraan/container, dan qty carton dengan benar.");
    return;
  }

  const duplicate=db.activities.find(a=>
    a.id!==id && a.date===date && a.type===type &&
    normalizeNumber(a.number)===normalizeNumber(number)
  );

  if(duplicate){
    alert("DUPLIKAT! Nomor ini sudah diinput pada tanggal dan jenis aktivitas yang sama oleh "+duplicate.loader.toUpperCase()+".");
    return;
  }

  const existing=id?db.activities.find(a=>a.id===id):null;
  if(id && !existing) return;
  if(existing && !isManager() && existing.loader!==currentUser) return;

  const record={
    id:id||uid(),
    date,type,number,qty,loader,
    createdAt:existing?.createdAt||new Date().toISOString(),
    updatedAt:new Date().toISOString()
  };

  if(existing){
    db.activities=db.activities.map(a=>a.id===id?record:a);
  }else{
    db.activities.push(record);
  }

  logAction(existing?"EDIT AKTIVITAS":"INPUT AKTIVITAS",
    `${date} | ${type} | ${number} | ${qty} carton | ${loader}`);
  saveDatabase();
  alert("Aktivitas tersimpan. Status validasi sudah diperbarui.");
  renderActivities();
}

function parseDate(value){
  const s=String(value??"").trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
    const d=new Date(s+"T12:00:00");
    return !isNaN(d) && localDate(d)===s?s:"";
  }
  const m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
  if(m){
    const iso=`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
    const d=new Date(iso+"T12:00:00");
    return !isNaN(d)&&localDate(d)===iso?iso:"";
  }
  return "";
}

function parseCSV(text){
  text=text.replace(/^\uFEFF/,"");
  const rows=[];
  let row=[],cell="",quoted=false;

  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='"'){
      if(quoted && text[i+1]==='"'){cell+='"';i++;}
      else quoted=!quoted;
    }else if(c==="," && !quoted){
      row.push(cell);cell="";
    }else if((c==="\n" || c==="\r") && !quoted){
      if(c==="\r" && text[i+1]==="\n")i++;
      row.push(cell);
      if(row.some(x=>x.trim()!==""))rows.push(row);
      row=[];cell="";
    }else{
      cell+=c;
    }
  }
  if(quoted)throw Error("Format tanda kutip CSV tidak lengkap.");
  row.push(cell);
  if(row.some(x=>x.trim()!==""))rows.push(row);
  return rows;
}

function masterKey(m){
  return `${m.date}|${m.type}|${normalizeNumber(m.number)}`;
}

async function uploadMaster(){
  const input=document.getElementById("masterFile");
  const file=input.files[0];
  const mode=document.getElementById("masterMode").value;

  if(!file){alert("Pilih file CSV terlebih dahulu.");return;}

  try{
    const rows=parseCSV(await file.text());
    if(rows.length<2)throw Error("File tidak memiliki data.");

    const headers=rows[0].map(x=>x.trim().toLowerCase()
      .replace(/[\s_-]+/g,""));

    const findHeader=(names)=>headers.findIndex(x=>names.includes(x));

    const dateIndex=findHeader(["tanggal","date"]);
    const typeIndex=findHeader(["jenis","type","aktivitas","jenisaktivitas"]);
    const numberIndex=findHeader([
      "nomor","nomobil","nocontainer","nomobil/nocontainer",
      "nomobilnocontainer","nopol","number","referensi"
    ]);
    const qtyIndex=findHeader([
      "qty","qtycarton","totalqtycarton","totalcarton",
      "carton","jumlahcarton"
    ]);

    if([dateIndex,typeIndex,numberIndex,qtyIndex].includes(-1)){
      throw Error("Header harus memuat: tanggal, jenis, nomor, qty. Gunakan template CSV.");
    }

    const imported=[];
    const seen=new Set();

    for(let i=1;i<rows.length;i++){
      const cells=rows[i];
      const date=parseDate(cells[dateIndex]);
      const type=normalizeType(cells[typeIndex]);
      const number=String(cells[numberIndex]??"").trim().toUpperCase();
      const rawQty=String(cells[qtyIndex]??"").trim();
      const qty=Number(rawQty);

      if(!date || !type || !number || rawQty==="" ||
        !Number.isSafeInteger(qty) || qty<0){
        throw Error(`Baris ${i+1} tidak valid. Periksa tanggal, jenis, nomor, dan qty.`);
      }

      const item={id:uid(),date,type,number,qty};
      const key=masterKey(item);

      if(seen.has(key)){
        throw Error(`Baris ${i+1} duplikat dalam file: ${date} ${type} ${number}`);
      }
      seen.add(key);
      imported.push(item);
    }

    if(!imported.length)throw Error("Tidak ada baris master yang valid.");

    if(mode==="replace"){
      if(!confirm("Mode Ganti Seluruh Master akan menghapus semua master lama. Lanjutkan?"))return;
      db.master=imported;
    }else{
      const map=new Map(db.master.map(m=>[masterKey(m),m]));
      for(const m of imported)map.set(masterKey(m),m);
      db.master=Array.from(map.values());
    }

    logAction("UPLOAD MASTER",`${file.name} | ${imported.length} baris | ${mode}`);
    saveDatabase();
    alert(`${imported.length} baris master berhasil diupload.\nValidasi aktivitas Loader otomatis diperbarui.`);
    renderMaster();
  }catch(err){
    alert("Upload gagal: "+err.message);
  }
}

function deleteMaster(id){
  if(currentUser!=="admin")return;

  if(!m || !confirm("Hapus baris master ini?"))return;

  logAction("HAPUS MASTER",`${m.date} | ${m.type} | ${m.number}`);
  saveDatabase();
  renderMaster();
}

function csvCell(value){
  const s=String(value??"");
  return '"'+s.replace(/"/g,'""')+'"';
}

function downloadCSV(filename,headers,rows){
  const csv=[headers,...rows].map(row=>row.map(csvCell).join(",")).join("\r\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
