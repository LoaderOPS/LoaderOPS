<script>
"use strict";

/* =====================================================
   1. KONFIGURASI
===================================================== */

const STORAGE_KEY = "LOADEROPS_FINAL_DEMO_V2";

const USERS = ["admin","spv","mijan","ompong","safar"];
const LOADERS = ["mijan","ompong","safar"];

let currentUser = sessionStorage.getItem("loaderops_user") || "";
let currentPage = "dashboard";
let db = loadDB();

let dash = {
  start: today(),
  end: today(),
  loader: "all"
};

let actFilter = {
  type: "all",
  start: "",
  end: ""
};

let editingId = null;


/* =====================================================
   2. FUNGSI DASAR
===================================================== */

function today() {
  const d = new Date();
  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
}

function uid() {
  return Date.now().toString(36)+
    Math.random().toString(36).slice(2);
}

function esc(v) {
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function fmt(v) {
  return Number(v||0).toLocaleString("id-ID");
}

function dateFmt(v) {
  if(!v)return "-";
  const p=v.split("-");
  return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:v;
}

function norm(v) {
  return String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
}

function normalizeType(v) {
  const x=String(v||"").trim().toLowerCase();
  if(["inbound","in","ib"].includes(x))return "Inbound";
  if(["outbound","out","ob"].includes(x))return "Outbound";
  return "";
}


/* =====================================================
   3. DATABASE
===================================================== */

function defaultDB() {
  return {
    master:[],
    activities:[],
    audit:[]
  };
}

function loadDB() {
  try {
    const x=JSON.parse(localStorage.getItem(STORAGE_KEY));

    if(x&&Array.isArray(x.master)&&Array.isArray(x.activities)) {
      return {...defaultDB(),...x};
    }
  } catch(e) {
    console.error(e);
  }

  return defaultDB();
}

function saveDB() {
  try {
    localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
  } catch(e) {
    alert("Gagal menyimpan data pada browser.");
  }
}

function logAction(action,detail) {
  db.audit.unshift({
    id:uid(),
    time:new Date().toLocaleString("id-ID"),
    user:currentUser,
    action,
    detail
  });

  db.audit=db.audit.slice(0,500);
}


/* =====================================================
   4. HAK AKSES
===================================================== */

function isAdmin() {
  return currentUser==="admin";
}

function isSPV() {
  return currentUser==="spv";
}

function isManager() {
  return isAdmin()||isSPV();
}

function isLoader() {
  return LOADERS.includes(currentUser);
}

function allowedPages() {
  if(isAdmin()) {
    return ["dashboard","master","activities","reports","audit"];
  }

  if(isSPV()) {
    return ["dashboard","activities","reports","audit"];
  }

  if(isLoader()) {
    return ["activities"];
  }

  return [];
}


/* =====================================================
   5. LOGIN
===================================================== */

function login() {
  const u=document.getElementById("loginUser").value;
  const p=document.getElementById("loginPass").value;

  if(!USERS.includes(u))return;

  if(p!=="demo123") {
    document.getElementById("loginError").textContent="Password salah.";
    return;
  }

  currentUser=u;
  sessionStorage.setItem("loaderops_user",u);
  showApp();
}

function logout() {
  currentUser="";
  sessionStorage.removeItem("loaderops_user");

  document.getElementById("appPage").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("loginPass").value="";
}

function showApp() {
  if(!USERS.includes(currentUser)) {
    logout();
    return;
  }

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("appPage").classList.remove("hidden");

  document.getElementById("userLabel").textContent=
    currentUser.toUpperCase()+" | "+
    (isAdmin()?"Administrator":isSPV()?"Supervisor":"Loader");

  if(isLoader()) {
    dash.loader=currentUser;
    navigate("activities");
  } else {
    navigate("dashboard");
  }
}


/* =====================================================
   6. NAVIGASI
===================================================== */

function navigate(page) {
  const allowed=allowedPages();

  if(!allowed.includes(page)) {
    page=isLoader()?"activities":"dashboard";
  }

  currentPage=page;

  const labels={
    dashboard:"📊 Dashboard",
    master:"📁 Upload Master Data",
    activities:"📋 Aktivitas Loader",
    reports:"📈 Laporan",
    audit:"🕒 Audit Log"
  };

  document.getElementById("navigation").innerHTML=
    allowed.map(p=>`
      <button class="${p===page?"active":""}"
        onclick="navigate('${p}')">
        ${labels[p]}
      </button>
    `).join("");

  render();
}

function render() {
  if(currentPage==="dashboard")renderDashboard();
  if(currentPage==="master")renderMaster();
  if(currentPage==="activities")renderActivities();
  if(currentPage==="reports")renderReports();
  if(currentPage==="audit")renderAudit();
}


/* =====================================================
   7. PARSING TANGGAL EXCEL
   November 2, 2026
   02/11/2026
   2026-11-02
   Excel serial date
===================================================== */

function parseDate(value) {
  const s=String(value||"").trim();
  if(!s)return "";

  // ISO YYYY-MM-DD
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);

  if(m) {
    const iso=m[1]+"-"+
      m[2].padStart(2,"0")+"-"+
      m[3].padStart(2,"0");

    const d=new Date(iso+"T12:00:00");

    return !isNaN(d)&&d.toISOString().slice(0,10)===iso
      ?iso:"";
  }

  // DD/MM/YYYY
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);

  if(m) {
    const day=Number(m[1]);
    const month=Number(m[2]);
    const year=Number(m[3]);

    const iso=year+"-"+
      String(month).padStart(2,"0")+"-"+
      String(day).padStart(2,"0");

    const d=new Date(iso+"T12:00:00");

    return !isNaN(d)&&
      d.toISOString().slice(0,10)===iso
      ?iso:"";
  }

  // Excel serial number
  if(/^\d{5}(\.\d+)?$/.test(s)) {
    const serial=Number(s);

    const d=new Date(
      Date.UTC(1899,11,30)+Math.floor(serial)*86400000
    );

    return d.toISOString().slice(0,10);
  }

  // Nama bulan Inggris atau format tanggal browser
  const d=new Date(s);

  if(!isNaN(d)) {
    return d.getFullYear()+"-"+
      String(d.getMonth()+1).padStart(2,"0")+"-"+
      String(d.getDate()).padStart(2,"0");
  }

  return "";
}


/* =====================================================
   8. PARSING CSV
===================================================== */

function detectDelimiter(text) {
  const line=text.replace(/^\uFEFF/,"").split(/\r?\n/)[0]||"";

  let comma=0;
  let semi=0;
  let quoted=false;

  for(let i=0;i<line.length;i++) {
    const c=line[i];

    if(c==='"') {
      if(quoted&&line[i+1]==='"')i++;
      else quoted=!quoted;
    } else if(!quoted&&c===",")comma++;
    else if(!quoted&&c===";")semi++;
  }

  return semi>comma?";":",";
}

function parseCSV(text) {
  text=text.replace(/^\uFEFF/,"");

  const delimiter=detectDelimiter(text);

  const rows=[];
  let row=[];
  let cell="";
  let quoted=false;

  for(let i=0;i<text.length;i++) {
    const c=text[i];

    if(c==='"') {
      if(quoted&&text[i+1]==='"') {
        cell+='"';
        i++;
      } else {
        quoted=!quoted;
      }
    } else if(c===delimiter&&!quoted) {
      row.push(cell);
      cell="";
    } else if((c==="\n"||c==="\r")&&!quoted) {
      if(c==="\r"&&text[i+1]==="\n")i++;

      row.push(cell);

      if(row.some(x=>x.trim()!==""))rows.push(row);

      row=[];
      cell="";
    } else {
      cell+=c;
    }
  }

  if(quoted)throw Error("Tanda kutip CSV tidak lengkap.");

  row.push(cell);

  if(row.some(x=>x.trim()!==""))rows.push(row);

  return rows;
}


/* =====================================================
   9. MASTER DAN VALIDASI
===================================================== */

function masterKey(m) {
  return m.date+"|"+m.type+"|"+norm(m.number);
}

function getValidation(a) {
  const matches=db.master.filter(m=>
    m.date===a.date&&
    m.type===a.type&&
    norm(m.number)===norm(a.number)
  );

  if(matches.length===0) {
    return {
      status:"Belum Dicocokkan",
      masterQty:null,
      difference:null
    };
  }

  if(matches.length>1) {
    return {
      status:"Tidak Sesuai",
      masterQty:null,
      difference:null
    };
  }

  const master=matches[0];
  const difference=Number(a.qty)-Number(master.qty);

  return {
    status:difference===0?"Sesuai":"Tidak Sesuai",
    masterQty:Number(master.qty),
    difference
  };
}

function kpi(name,value,sub) {
  return `
    <div class="kpi">
      <div class="name">${esc(name)}</div>
      <div class="value">${fmt(value)}</div>
      <div class="sub">${esc(sub)}</div>
    </div>
  `;
}

function tag(status) {
  const cls=status==="Sesuai"?"ok":
    status==="Tidak Sesuai"?"bad":"wait";

  return `<span class="tag ${cls}">${esc(status)}</span>`;
}


/* =====================================================
   10. UPLOAD MASTER CSV
   DUPLIKAT NOMOR DIJUMLAHKAN
===================================================== */

async function uploadMaster() {
  if(!isAdmin())return;

  const file=document.getElementById("masterFile").files[0];
  const mode=document.getElementById("masterMode").value;

  if(!file)return alert("Pilih file master terlebih dahulu.");

  try {
    const rows=parseCSV(await file.text());

    if(rows.length<2)throw Error("File kosong.");

    const headers=rows[0].map(x=>
      x.toLowerCase().trim().replace(/[\s_-]+/g,"")
    );

    const find=names=>headers.findIndex(x=>names.includes(x));

    const di=find(["tanggal","date"]);
    const ti=find(["jenis","type","aktivitas","jenisaktivitas"]);
    const ni=find([
      "nomor","nomobil","nocontainer",
      "nomobilcontainer","referensi","nopol"
    ]);
    const qi=find([
      "qty","carton","qtycarton","totalcarton","totalqtycarton"
    ]);

    if([di,ti,ni,qi].includes(-1)) {
      throw Error("Header wajib: TANGGAL, JENIS, NOMOR, QTY.");
    }

    // Gabungkan semua baris dengan kombinasi sama.
    const grouped=new Map();

    for(let i=1;i<rows.length;i++) {
      const r=rows[i];

      if(!r.some(x=>String(x).trim()!==""))continue;

      const date=parseDate(r[di]);
      const type=normalizeType(r[ti]);
      const number=String(r[ni]||"").trim().toUpperCase();
      const raw=String(r[qi]??"").trim();

      const qty=Number(raw.replace(/,/g,""));

      if(!date||!type||!number||
        raw===""||!Number.isSafeInteger(qty)||qty<0) {
        throw Error("Data tidak valid pada baris "+(i+1));
      }

      const key=date+"|"+type+"|"+norm(number);

      if(!grouped.has(key)) {
        grouped.set(key,{
          id:uid(),
          date,
          type,
          number,
          qty:0
        });
      }

      const item=grouped.get(key);

      item.qty+=qty;

      if(!Number.isSafeInteger(item.qty)) {
        throw Error("Total qty terlalu besar.");
      }
    }

    const imported=Array.from(grouped.values());

    if(!imported.length)throw Error("Tidak ada data.");

    if(mode==="replace") {
      if(!confirm("Ganti seluruh master lama dengan data baru?"))return;

      db.master=imported;

    } else {
      const map=new Map(
        db.master.map(m=>[masterKey(m),m])
      );

      imported.forEach(m=>{
        const key=masterKey(m);
        const old=map.get(key);

        if(old)m.id=old.id;

        map.set(key,m);
      });

      db.master=Array.from(map.values());
    }

    logAction(
      "UPLOAD MASTER",
      file.name+" | "+
      (rows.length-1)+" baris | "+
      imported.length+" nomor unik"
    );

    saveDB();

    alert(
      "UPLOAD BERHASIL!\n\n"+
      "Jumlah baris sumber: "+(rows.length-1)+"\n"+
      "Jumlah nomor unik: "+imported.length+
      "\nQty carton berhasil dijumlahkan otomatis."
    );

    renderMaster();

  } catch(e) {
    console.error(e);
    alert("Upload gagal: "+e.message);
  }
}


/* =====================================================
   11. TAMPILAN MASTER
===================================================== */

function renderMaster() {
  if(!isAdmin()) {
    navigate("dashboard");
    return;
  }

  const rows=db.master.slice()
    .sort((a,b)=>b.date.localeCompare(a.date));

  const valid=db.activities.filter(a=>
    getValidation(a).status==="Sesuai"
  ).length;

  const invalid=db.activities.filter(a=>
    getValidation(a).status==="Tidak Sesuai"
  ).length;

  const pending=db.activities.length-valid-invalid;

  document.getElementById("content").innerHTML=`
    <section class="panel">
      <h3>Upload Master Data Mingguan</h3>

      <div class="notice">
        Master berisi tanggal, jenis aktivitas,
        nomor mobil/container, dan total qty carton.
        Nomor yang sama pada tanggal dan jenis sama
        akan dijumlahkan otomatis.
      </div>

      <div class="formgrid">
        <div class="field">
          <label>File Master CSV</label>
          <input type="file" id="masterFile" accept=".csv,text/csv">
        </div>

        <div class="field">
          <label>Mode Upload</label>
          <select id="masterMode">
            <option value="merge">Tambah / Perbarui Master</option>
            <option value="replace">Ganti Seluruh Master</option>
          </select>
        </div>

        <div class="field">
          <label>&nbsp;</label>
          <button class="btn green" onclick="uploadMaster()">
            Upload & Validasi
          </button>
        </div>
      </div>

      <button class="btn light" onclick="downloadTemplate()">
        Download Template CSV
      </button>

      <p class="muted">
        Header CSV: TANGGAL, JENIS, NOMOR, QTY.
        Excel disimpan sebagai CSV UTF-8.
      </p>
    </section>

    <div class="cards">
      ${kpi("Total Master",rows.length,"Nomor unik")}
      ${kpi("Aktivitas Sesuai",valid,"Validasi")}
      ${kpi("Tidak Sesuai",invalid,"Perlu pemeriksaan")}
      ${kpi("Belum Dicocokkan",pending,"Master tidak ditemukan")}
    </div>

    <section class="panel">
      <div class="toolbar">
        <h3>Daftar Master Data</h3>
        <button class="btn light" onclick="exportMaster()">
          Ekspor CSV
        </button>
      </div>
      ${masterTable(rows)}
    </section>
  `;
}

function masterTable(rows) {

/* =====================================================
   12. TEMPLATE CSV DAN EKSPOR
===================================================== */

function csvCell(v) {
  return '"'+String(v??"").replace(/"/g,'""')+'"';
}

function downloadCSV(filename,headers,rows) {
  const csv=[headers,...rows]
    .map(r=>r.map(csvCell).join(","))
    .join("\r\n");

  const blob=new Blob(["\uFEFF"+csv],{
    type:"text/csv;charset=utf-8"
  });

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download=filename;

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function downloadTemplate() {
  downloadCSV(
    "template_master_loaderops.csv",
    ["tanggal","jenis","nomor","qty"],
    [
      ["2026-11-02","Inbound","B 9075 KXV",29],
      ["2026-11-02","Inbound","B 9167 UEM",323],
      ["2026-11-02","Outbound","BSIU8021455",750]
    ]
  );
}

    ["tanggal","jenis","nomor","qty"],

/* =====================================================
   13. DASHBOARD
===================================================== */

function dashboardRows() {
  return db.activities.filter(a=>
    a.date>=dash.start&&
    a.date<=dash.end&&
    (dash.loader==="all"||a.loader===dash.loader)
  );
}

function dashboardFilterHTML() {
  return `
    <div class="field">
      <label>Tanggal Mulai</label>
      <input type="date" id="dashStart" value="${esc(dash.start)}">
    </div>

    <div class="field">
      <label>Tanggal Akhir</label>
      <input type="date" id="dashEnd" value="${esc(dash.end)}">
    </div>

    <div class="field">
      <label>Loader</label>
      <select id="dashLoader">
        <option value="all">Semua Loader</option>
        ${LOADERS.map(x=>`
          <option value="${x}" ${dash.loader===x?"selected":""}>
            ${x.toUpperCase()}
          </option>
        `).join("")}
      </select>
    </div>

    <div class="field">
      <button class="btn" onclick="applyDashFilter()">Terapkan</button>

}

function applyDashFilter() {
  const start=document.getElementById("dashStart").value;
  const end=document.getElementById("dashEnd").value;

  if(start>end) {
    alert("Tanggal mulai melebihi tanggal akhir.");
    return;
  }

  dash.start=start;
  dash.end=end;
  dash.loader=document.getElementById("dashLoader").value;

  renderDashboard();
}

function resetDashFilter() {
  dash={start:today(),end:today(),loader:"all"};
  renderDashboard();
}

function chartBar(label,value,max,color) {
  const width=value===0?0:Math.max(1,value/max*100);

  return `
    <div class="chartrow">
      <span class="muted">${label}</span>
      <div class="track">
        <div class="bar ${color}" style="width:${width}%"></div>
      </div>
      <b style="text-align:right">${fmt(value)}</b>
    </div>
  `;
}

function renderDashboard() {
  const rows=dashboardRows();

  const sum=arr=>arr.reduce((s,a)=>s+Number(a.qty),0);

  const inbound=rows.filter(a=>a.type==="Inbound");
  const outbound=rows.filter(a=>a.type==="Outbound");

  const valid=rows.filter(a=>
    getValidation(a).status==="Sesuai"
  ).length;

  const invalid=rows.filter(a=>
    getValidation(a).status==="Tidak Sesuai"
  ).length;

  const pending=rows.length-valid-invalid;

  const loaders=dash.loader==="all"?LOADERS:[dash.loader];

  const stats=loaders.map(loader=>{
    const r=rows.filter(a=>a.loader===loader);

    return {
      name:loader,
      inbound:sum(r.filter(a=>a.type==="Inbound")),
      outbound:sum(r.filter(a=>a.type==="Outbound")),
      count:r.length
    };
  });

  const max=Math.max(
    1,...stats.flatMap(x=>[x.inbound,x.outbound])
  );

  document.getElementById("content").innerHTML=`
    <section class="panel">
      <h3>Dashboard Warehouse</h3>
      <p class="muted">Filter tanggal dan performa Loader.</p>
      <div class="filters">${dashboardFilterHTML()}</div>
    </section>

    <div class="cards">
      ${kpi("Total Aktivitas",rows.length,"Transaksi")}
      ${kpi("Carton Inbound",sum(inbound),"Qty Loader")}
      ${kpi("Carton Outbound",sum(outbound),"Qty Loader")}
      ${kpi("Aktivitas Sesuai",valid,"Validasi Master")}
      ${kpi("Tidak Sesuai",invalid,"Perlu pemeriksaan")}
      ${kpi("Belum Dicocokkan",pending,"Master tidak ditemukan")}
      ${kpi("Jumlah Inbound",inbound.length,"Transaksi")}
      ${kpi("Jumlah Outbound",outbound.length,"Transaksi")}
    </div>

    <section class="panel">
      <h3>Chart Performa Carton per Loader</h3>
      <p class="muted">Grafik mengikuti filter tanggal dan Loader.</p>

      <div class="legend">
        <span><i class="dot blue"></i>Inbound</span>
        <span><i class="dot orange"></i>Outbound</span>
      </div>

      ${stats.map(x=>`
        <div style="margin-bottom:23px">
          <b>${x.name.toUpperCase()}</b>
          <span class="muted">(${x.count} aktivitas)</span>
          ${chartBar("Inbound",x.inbound,max,"blue")}
          ${chartBar("Outbound",x.outbound,max,"orange")}
        </div>
      `).join("")}

      ${!rows.length?'<p class="muted">Belum ada aktivitas pada periode ini.</p>':""}
    </section>

    <section class="panel">
      <h3>Aktivitas Terbaru</h3>
      ${activityTable(
        rows.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20),
        false
      )}
    </section>
  `;
}

function openActivityForm(id="") {
  if(!isLoader()) {
    alert("Hanya Loader yang boleh input dan edit.");
    return;
  }

  const a=id?db.activities.find(x=>x.id===id):null;

  if(id&&!a)return alert("Aktivitas tidak ditemukan.");

  if(a&&a.loader!==currentUser) {
    return alert("Kamu hanya dapat mengedit aktivitas sendiri.");
  }

  editingId=id;

  document.getElementById("activityForm").innerHTML=`
    <section class="panel">
      <h3>${a?"Edit Aktivitas":"Input Aktivitas Baru"}</h3>

      <div class="formgrid">
        <div class="field">
          <label>Tanggal</label>
          <input type="date" id="formDate" value="${esc(a?.date||today())}">
        </div>

        <div class="field">
          <label>Jenis Aktivitas</label>
          <select id="formType">
            <option value="Inbound" ${a?.type==="Inbound"?"selected":""}>Inbound</option>
            <option value="Outbound" ${a?.type==="Outbound"?"selected":""}>Outbound</option>
          </select>
        </div>

        <div class="field">
          <label>Loader</label>
          <input value="${currentUser.toUpperCase()}" disabled>
        </div>

        <div class="field">
          <label>No Mobil / Container</label>
          <input id="formNumber" value="${esc(a?.number||"")}"
            placeholder="B 9123 XYZ / BSIU8021455">
        </div>

        <div class="field">
          <label>Total Qty Carton</label>
          <input type="number" min="0" step="1"
            id="formQty" value="${a?.qty??""}">
        </div>
      </div>

      <p class="muted">
        Satu Loader boleh mengerjakan beberapa inbound dan outbound
        dengan nomor mobil/container berbeda.
      </p>

      <div class="actions">
        <button class="btn green" onclick="saveActivity()">Simpan Aktivitas</button>
        <button class="btn gray" onclick="renderActivities()">Batal</button>
      </div>
    </section>
  `;

  document.getElementById("activityForm")
    .scrollIntoView({behavior:"smooth"});
}

function editActivity(id) {
  if(!isLoader())return;

  const a=db.activities.find(x=>x.id===id);
  if(!a)return;

  if(a.loader!==currentUser) {
    alert("Kamu tidak bisa mengedit aktivitas Loader lain.");
    return;
  }

  openActivityForm(id);
}


/* =====================================================
   18. SIMPAN AKTIVITAS
===================================================== */

function saveActivity() {
  if(!isLoader()) {
    alert("Akses ditolak.");
    return;
  }

  const id=editingId;

  const date=document.getElementById("formDate").value;
  const type=document.getElementById("formType").value;
  const number=document.getElementById("formNumber").value.trim().toUpperCase();
  const raw=document.getElementById("formQty").value;
  const qty=Number(raw);

  if(!date||!number||raw===""||
    !Number.isSafeInteger(qty)||qty<0) {
    alert("Lengkapi tanggal, nomor, dan qty carton.");
    return;
  }

  const existing=id?db.activities.find(a=>a.id===id):null;

  if(id&&!existing)return alert("Aktivitas tidak ditemukan.");

  if(existing&&existing.loader!==currentUser) {
    alert("Kamu tidak memiliki hak untuk mengedit data ini.");
    return;
  }

  // Nomor yang sama pada tanggal dan jenis yang sama
  // hanya boleh tercatat satu kali di seluruh Loader.

  const duplicate=db.activities.find(a=>
    a.id!==id&&
    a.date===date&&
    a.type===type&&
    norm(a.number)===norm(number)
  );

  if(duplicate) {
    alert(
      "NOMOR SUDAH TERDAFTAR!\n\n"+
      "Nomor ini sudah digunakan oleh "+
      duplicate.loader.toUpperCase()+
      " pada tanggal dan jenis aktivitas yang sama."
    );
    return;
  }

  const record={
    id:id||uid(),
    date,
    type,
    number,
    qty,
    loader:currentUser,
    createdAt:existing?.createdAt||new Date().toISOString(),
    updatedAt:new Date().toISOString()
  };

  if(existing) {
    db.activities=db.activities.map(a=>a.id===id?record:a);
    logAction("EDIT AKTIVITAS",date+" | "+type+" | "+number);
  } else {
    db.activities.push(record);
    logAction("INPUT AKTIVITAS",date+" | "+type+" | "+number);
  }

  saveDB();

  editingId=null;

  alert("Aktivitas berhasil disimpan. Validasi otomatis diperbarui.");

  renderActivities();
}


/* =====================================================
   19. DELETE AKTIVITAS
===================================================== */

function deleteActivity(id) {
  if(!isLoader()) {
    alert("Akses ditolak.");
    return;
  }

  const a=db.activities.find(x=>x.id===id);
  if(!a)return;

  if(a.loader!==currentUser) {
    alert("Kamu hanya dapat menghapus aktivitas milik sendiri.");
    return;
  }

  if(!confirm("Yakin ingin menghapus aktivitas ini?"))return;

  db.activities=db.activities.filter(x=>x.id!==id);

  logAction("HAPUS AKTIVITAS",
    a.date+" | "+a.type+" | "+a.number);

  saveDB();

  editingId=null;

  renderActivities();
}
