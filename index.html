
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoaderOPS - Warehouse Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
:root {
  font-family: Arial, sans-serif;
  color: #26384b;
  background: #f3f6fa;
}
* { box-sizing: border-box; }
body { margin: 0; }
button,input,select { font: inherit; }
button { cursor: pointer; }
.hidden { display:none!important; }

.btn {
  border:0;
  border-radius:8px;
  padding:10px 14px;
  background:#1769aa;
  color:white;
  font-weight:bold;
}
.green { background:#16815e; }
.red { background:#c43d49; }
.gray { background:#64748b; }
.light { background:#e8eff7;color:#23466a; }

.login {
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:linear-gradient(135deg,#12345a,#2674b7);
}
.loginbox {
  background:white;
  width:min(420px,100%);
  padding:32px;
  border-radius:17px;
  box-shadow:0 15px 40px #0003;
}
.loginbox h1 { color:#1769aa;margin:0; }
.loginbox p { color:#718096; }

header {
  background:#12345a;
  color:white;
  padding:17px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
header h2 { margin:0; }
header small { color:#d5e4f3; }

nav {
  display:flex;
  gap:8px;
  padding:12px 20px;
  background:white;
  border-bottom:1px solid #e1e8ef;
  flex-wrap:wrap;
}
nav button {
  border:0;
  background:#edf3f9;
  color:#31516e;
  border-radius:8px;
  padding:10px 14px;
  font-weight:bold;
}
nav button.active { background:#1769aa;color:white; }

main {
  max-width:1400px;
  margin:auto;
  padding:22px;
}
.panel {
  background:white;
  border:1px solid #e1e8f0;
  border-radius:13px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 2px 10px #193c6008;
}
.panel h3 { margin:0 0 15px;color:#173d67; }

.muted { font-size:13px;color:#718096;line-height:1.5; }
.notice {
  padding:12px;
  border-radius:8px;
  background:#eaf3fc;
  color:#315a81;
  font-size:13px;
  margin-bottom:15px;
}
.field { margin-bottom:13px; }
label {
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}
input,select {
  width:100%;
  padding:10px;
  border:1px solid #ccd7e3;
  border-radius:8px;
  background:white;
}
.cards {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:13px;
  margin-bottom:18px;
}
.kpi {
  background:white;
  border:1px solid #e0e8f0;
  border-radius:12px;
  padding:17px;
}
.kpi .name { font-size:13px;color:#718096; }
.kpi .value {
  font-size:27px;
  font-weight:800;
  color:#173d67;
  margin-top:8px;
}
.kpi .sub { font-size:12px;color:#8794a3;margin-top:5px; }

.filters,.formgrid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  align-items:end;
}
.formgrid { grid-template-columns:repeat(3,minmax(0,1fr)); }

.tablewrap { overflow-x:auto; }
table { border-collapse:collapse;width:100%;font-size:13px; }
th,td {
  text-align:left;
  padding:11px;
  border-bottom:1px solid #e7edf4;
  white-space:nowrap;
}
th { background:#f0f5fa;color:#456079; }
tr:hover td { background:#fafcff; }

.tag {
  display:inline-block;
  padding:5px 9px;
  border-radius:30px;
  font-size:12px;
  font-weight:bold;
}
.ok { background:#def6e8;color:#12643c; }
.bad { background:#ffe4e4;color:#a32935; }
.wait { background:#fff1cd;color:#8b6500; }

.toolbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}
.actions { display:flex;gap:7px; }
.actions .btn { padding:7px 10px;font-size:12px; }

.chartrow {
  display:grid;
  grid-template-columns:110px 1fr 75px;
  gap:12px;
  align-items:center;
  margin:12px 0;
}
.track {
  height:14px;
  background:#edf1f7;
  border-radius:20px;
  overflow:hidden;
}
.bar { height:100%;border-radius:20px; }
.blue { background:#287bd1; }
.orange { background:#f5a23a; }
.legend { display:flex;gap:18px;font-size:13px; }
.dot {
  display:inline-block;
  width:10px;height:10px;
  border-radius:3px;
  margin-right:5px;
}
hr {
  border:0;
  border-top:1px solid #e7edf4;
  margin:18px 0;
}
.toast {
  position:fixed;
  bottom:20px;
  right:20px;
  max-width:360px;
  padding:14px 18px;
  border-radius:9px;
  background:#173d67;
  color:white;
  z-index:99;
  box-shadow:0 5px 20px #0003;
}
.statusline { font-size:12px;color:#d5e4f3;margin-top:4px; }

@media(max-width:900px) {
  .cards { grid-template-columns:repeat(2,1fr); }
  .filters,.formgrid { grid-template-columns:repeat(2,1fr); }
}
@media(max-width:520px) {
  main { padding:12px; }
  .cards,.filters,.formgrid { grid-template-columns:1fr; }
  .chartrow { grid-template-columns:75px 1fr 65px; }
}
@media print {
  header,nav,.no-print { display:none!important; }
  main { padding:0; }
  .panel,.kpi { box-shadow:none; }
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginPage" class="login">
  <div class="loginbox">
    <h1>📦 LOADEROPS</h1>
    <p>Warehouse Operational Monitoring System</p>

    <div class="notice">
      Supabase Connected Warehouse System
    </div>

    <div class="field">
      <label>Email</label>
      <input id="loginEmail" type="email"
        placeholder="Masukkan email Supabase"
        autocomplete="username">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="loginPass" type="password"
        placeholder="Masukkan password"
        autocomplete="current-password">
    </div>

    <button class="btn" style="width:100%" onclick="login()">
      LOGIN
    </button>
    <p id="loginError" style="color:#b91c1c"></p>
  </div>
</section>

<!-- APPLICATION -->
<section id="appPage" class="hidden">
  <header>
    <div>
      <h2>📦 LOADEROPS</h2>
      <small>Warehouse Operational Monitoring System</small>
      <div class="statusline" id="syncStatus">Connecting...</div>
    </div>
    <div>
      <span id="userLabel"></span>
      <button class="btn gray" onclick="logout()">Logout</button>
    </div>
  </header>

  <nav id="navigation"></nav>
  <main id="content"></main>
</section>

<div id="toast" class="toast hidden"></div>

<script>
"use strict";

/* ================================================
   1. SUPABASE CONFIGURATION
================================================ */

const SUPABASE_URL =
  "https://rumtkbyswizttypfrgqg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_u7km6UiSDYSaRtRftTholg_wDAuodyk";

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* ================================================
   2. APPLICATION STATE
================================================ */

let authUser = null;
let profile = null;
let currentPage = "dashboard";

let inbound = [];
let outbound = [];
let master = [];
let uploads = [];
let audit = [];
let profiles = [];

let editing = null;
let realtimeChannel = null;

let dash = {
  start: today(),
  end: today(),
  loader: "all"
};

let actFilter = {
  type: "all",
  start: "",
  end: ""
};

/* ================================================
   3. BASIC FUNCTIONS
================================================ */

function today() {
  const d = new Date();
  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
}

function esc(v) {
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function fmt(v) {
  return Number(v||0).toLocaleString("id-ID");
}

function dateFmt(v) {
  if(!v)return "-";
  const p=String(v).split("-");
  return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:v;
}

function norm(v) {
  return String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
}

function normalizeType(v) {
  const x=String(v||"").trim().toLowerCase();
  if(["inbound","in","ib"].includes(x))return "INBOUND";
  if(["outbound","out","ob"].includes(x))return "OUTBOUND";
  return "";
}

function notify(message) {
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.remove("hidden");
  setTimeout(()=>el.classList.add("hidden"),3500);
}

function setSync(message) {
  document.getElementById("syncStatus").textContent=message;
}

function isAdmin() {
  return profile?.role==="admin";
}

function isSPV() {
  return profile?.role==="spv";
}

function isLoader() {
  return profile?.role==="loader";
}

function isManager() {
  return isAdmin()||isSPV();
}

function loaderName(id) {
  const p=profiles.find(x=>x.id===id);
  return p?.full_name||p?.username||"Loader";
}

function allowedPages() {
  if(isAdmin())
    return ["dashboard","master","activities","reports","audit"];

  if(isSPV())
    return ["dashboard","activities","reports","audit"];

  if(isLoader())
    return ["activities"];

  return [];
}

/* ================================================
   4. AUTHENTICATION
================================================ */

async function login() {
  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPass").value;

  const error=document.getElementById("loginError");
  error.textContent="";

  if(!email||!password) {
    error.textContent="Email dan password wajib diisi.";
    return;
  }

  try {
    const {data,error:err}=await sb.auth.signInWithPassword({
      email,
      password
    });

    if(err)throw err;

    authUser=data.user;
    await initializeApp();

  } catch(e) {
    error.textContent=e.message;
  }
}

async function logout() {
  if(realtimeChannel) {
    await sb.removeChannel(realtimeChannel);
    realtimeChannel=null;
  }

  await sb.auth.signOut();

  authUser=null;
  profile=null;

  document.getElementById("appPage").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("loginPass").value="";
}

async function initializeApp() {
  const {data,error}=await sb
    .from("profiles")
    .select("*")
    .eq("id",authUser.id)
    .single();

  if(error)throw error;

  profile=data;

  if(!profile.is_active) {
    await logout();
    throw new Error("Akun tidak aktif. Hubungi Administrator.");
  }

  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("appPage").classList.remove("hidden");

  document.getElementById("userLabel").textContent=
    profile.full_name+" | "+profile.role.toUpperCase();

  await loadAll();

  if(isLoader()) {
    navigate("activities");
  } else {
    navigate("dashboard");
  }

  setupRealtime();
}

sb.auth.onAuthStateChange(async(event,session)=>{
  if(event==="SIGNED_OUT")return;

  if(session?.user&&!profile) {
    authUser=session.user;
    try {
      await initializeApp();
    } catch(e) {
      console.error(e);
      notify(e.message);
    }
  }
});

/* ================================================
   5. LOAD DATABASE
================================================ */

async function loadAll() {
  setSync("Loading database...");

  const tasks=[
    sb.from("profiles").select("id,full_name,username,role,is_active"),
    sb.from("inbound_activities").select("*").order("activity_date",{ascending:false}),
    sb.from("outbound_activities").select("*").order("activity_date",{ascending:false}),
    sb.from("excel_reference_rows").select("*"),
    sb.from("excel_uploads").select("*").order("created_at",{ascending:false})
  ];

  const results=await Promise.all(tasks);

  for(const r of results) {
    if(r.error)throw r.error;
  }

  profiles=results[0].data||[];
  inbound=results[1].data||[];
  outbound=results[2].data||[];
  master=results[3].data||[];
  uploads=results[4].data||[];

  if(isManager()) {
    const a=await sb.from("audit_logs")
      .select("*")
      .order("created_at",{ascending:false})
      .limit(500);

    if(!a.error)audit=a.data||[];
  }

  setSync("● Connected to Supabase");
}

async function refreshData() {
  try {
    await loadAll();
    render();
  } catch(e) {
    console.error(e);
    notify("Gagal refresh: "+e.message);
  }
}

/* ================================================
   6. REALTIME
================================================ */

function setupRealtime() {
  if(realtimeChannel)sb.removeChannel(realtimeChannel);

  realtimeChannel=sb.channel("loaderops-live");

  [
    "inbound_activities",
    "outbound_activities",
    "excel_reference_rows",
    "excel_uploads"
  ].forEach(table=>{
    realtimeChannel.on(
      "postgres_changes",
      {event:"*",schema:"public",table},
      ()=>refreshData()
    );
  });

  realtimeChannel.subscribe(status=>{
    if(status==="SUBSCRIBED")
      setSync("● Realtime connected");
  });
}

/* ================================================
   7. NAVIGATION
================================================ */

function navigate(page) {
  if(!allowedPages().includes(page))
    page=isLoader()?"activities":"dashboard";

  currentPage=page;

  const labels={
    dashboard:"📊 Dashboard",
    master:"📁 Upload Master Data",
    activities:"📋 Aktivitas Loader",
    reports:"📈 Laporan",
    audit:"🕒 Audit Log"
  };

  document.getElementById("navigation").innerHTML=
    allowedPages().map(p=>`
      <button class="${p===page?"active":""}"
        onclick="navigate('${p}')">
        ${labels[p]}
      </button>
    `).join("");

  render();
}

function render() {
  if(currentPage==="dashboard")renderDashboard();
  if(currentPage==="master")renderMaster();
  if(currentPage==="activities")renderActivities();
  if(currentPage==="reports")renderReports();
  if(currentPage==="audit")renderAudit();
}

/* ================================================
   8. MASTER VALIDATION
================================================ */

function activityType(row) {
  return normalizeType(row.activity_type);
}

function masterMatches(type,date,number) {
  return master.filter(m=>
    activityType(m)===type &&
    m.activity_date===date &&
    (
      type==="INBOUND"
        ? norm(m.vehicle_number)===norm(number)
        : norm(m.container_number||m.vehicle_number)===norm(number)
    )
  );
}

function validateActivity(type,row) {
  const number=type==="INBOUND"
    ? row.vehicle_number
    : row.container_number;

  const matches=masterMatches(
    type,row.activity_date,number
  );

  if(!matches.length) {
    return {
      status:"Belum Dicocokkan",
      qty:null,
      difference:null,
      match:null
    };
  }

  const expected=matches.reduce(
    (s,m)=>s+Number(m.total_carton||0),0
  );

  const difference=Number(row.total_carton)-expected;

  return {
    status:difference===0?"Sesuai":"Tidak Sesuai",
    qty:expected,
    difference,
    match:matches[0]
  };
}

function tag(status) {
  const cls=status==="Sesuai"?"ok":
    status==="Tidak Sesuai"?"bad":"wait";

  return `<span class="tag ${cls}">${esc(status)}</span>`;
}

function allActivities() {
  const a=inbound.map(x=>({
    ...x,type:"INBOUND",
    number:x.vehicle_number
  }));

  const b=outbound.map(x=>({
    ...x,type:"OUTBOUND",
    number:x.container_number
  }));

  return [...a,...b].sort((x,y)=>
    y.activity_date.localeCompare(x.activity_date)
  );
}

function visibleActivities() {
  let rows=allActivities();

  if(isLoader())
    rows=rows.filter(x=>x.loader_id===authUser.id);

  if(actFilter.type!=="all")
    rows=rows.filter(x=>x.type===actFilter.type);

  if(actFilter.start)
    rows=rows.filter(x=>x.activity_date>=actFilter.start);

  if(actFilter.end)
    rows=rows.filter(x=>x.activity_date<=actFilter.end);

  return rows;
}

/* ================================================
   9. DASHBOARD
================================================ */

function kpi(name,value,sub) {
  return `
    <div class="kpi">
      <div class="name">${esc(name)}</div>
      <div class="value">${fmt(value)}</div>
      <div class="sub">${esc(sub)}</div>
    </div>
  `;
}

function renderDashboard() {
  if(!isManager())return;

  let rows=allActivities().filter(a=>
    a.activity_date>=dash.start&&
    a.activity_date<=dash.end
  );

  if(dash.loader!=="all")
    rows=rows.filter(a=>a.loader_id===dash.loader);

  const total=rows.reduce((s,a)=>s+Number(a.total_carton),0);
  const ins=rows.filter(a=>a.type==="INBOUND");
  const outs=rows.filter(a=>a.type==="OUTBOUND");

  const valid=rows.filter(a=>
    validateActivity(a.type,a).status==="Sesuai"
  ).length;

  const invalid=rows.filter(a=>
    validateActivity(a.type,a).status==="Tidak Sesuai"
  ).length;

  const pending=rows.length-valid-invalid;

  const loaderIds=[...new Set(rows.map(a=>a.loader_id))];

  document.getElementById("content").innerHTML=`
    <section class="panel">
      <h3>Dashboard Operasional</h3>

      <div class="filters no-print">
        <div class="field">
          <label>Tanggal Mulai</label>
          <input type="date" id="dashStart" value="${dash.start}">
        </div>
        <div class="field">
          <label>Tanggal Akhir</label>
          <input type="date" id="dashEnd" value="${dash.end}">
        </div>
        <div class="field">
          <label>Loader</label>
          <select id="dashLoader">
            <option value="all">Semua Loader</option>
            ${profiles.filter(p=>p.role==="loader").map(p=>`
              <option value="${p.id}" ${dash.loader===p.id?"selected":""}>
                ${esc(p.full_name)}
              </option>
            `).join("")}
          </select>
        </div>
        <div class="field">
          <button class="btn" onclick="applyDash()">Terapkan Filter</button>
        </div>
      </div>

      <p class="muted">
        Periode ${dateFmt(dash.start)} sampai ${dateFmt(dash.end)}
      </p>
    </section>

    <div class="cards">
      ${kpi("Total Aktivitas",rows.length,"Transaksi")}
      ${kpi("Total Carton",total,"Carton")}
      ${kpi("Inbound",ins.reduce((s,a)=>s+Number(a.total_carton),0),"Carton")}
      ${kpi("Outbound",outs.reduce((s,a)=>s+Number(a.total_carton),0),"Carton")}
    </div>

    <div class="cards">
      ${kpi("Sesuai Master",valid,"Transaksi")}
      ${kpi("Tidak Sesuai",invalid,"Perlu pemeriksaan")}
      ${kpi("Belum Dicocokkan",pending,"Belum ada referensi")}
      ${kpi("Master Data",master.length,"Baris referensi")}
    </div>

    <section class="panel">
      <h3>Performa Carton per Loader</h3>
      <div class="legend">
        <span><i class="dot blue"></i>Inbound</span>
        <span><i class="dot orange"></i>Outbound</span>
      </div>
      ${loaderIds.length?loaderIds.map(id=>{
        const name=loaderName(id);
        const iv=rows.filter(a=>a.loader_id===id&&a.type==="INBOUND")
          .reduce((s,a)=>s+Number(a.total_carton),0);
        const ov=rows.filter(a=>a.loader_id===id&&a.type==="OUTBOUND")
          .reduce((s,a)=>s+Number(a.total_carton),0);
        const max=Math.max(iv,ov,1);

        return `
          <div style="margin-top:20px">
            <b>${esc(name)}</b>
            <div class="chartrow">
              <span>Inbound</span>
              <div class="track"><div class="bar blue" style="width:${iv/max*100}%"></div></div>
              <b>${fmt(iv)}</b>
            </div>
            <div class="chartrow">
              <span>Outbound</span>
              <div class="track"><div class="bar orange" style="width:${ov/max*100}%"></div></div>
              <b>${fmt(ov)}</b>
            </div>
          </div>
        `;
      }).join(""):'<p class="muted">Belum ada aktivitas.</p>'}
    </section>

    <section class="panel">
      <h3>Aktivitas Terbaru</h3>
      ${activityTable(rows.slice(0,30))}
    </section>
  `;
}

function applyDash() {
  dash.start=document.getElementById("dashStart").value;
  dash.end=document.getElementById("dashEnd").value;
  dash.loader=document.getElementById("dashLoader").value;

  if(dash.start>dash.end) {
    notify("Tanggal mulai tidak boleh melewati tanggal akhir.");
    return;
  }
  renderDashboard();
}

/* ================================================
   10. ACTIVITY TABLE
================================================ */

function activityTable(rows) {
  if(!rows.length)
    return '<p class="muted">Belum ada aktivitas.</p>';

  return `
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Loader</th>
            <th>Jenis</th>
            <th>No Mobil/Container</th>
            <th>Qty Loader</th>
            <th>Qty Master</th>
            <th>Selisih</th>
            <th>Status</th>
            ${currentPage==="activities"?"<th>Aksi</th>":""}
          </tr>
        </thead>
        <tbody>
          ${rows.map(a=>{
            const v=validateActivity(a.type,a);
            const own=a.loader_id===authUser.id;
            const canEdit=isAdmin()||(
              isLoader()&&own&&
              a.reconciliation_status==="Belum Dicocokkan"
            );

            const canDelete=isAdmin()||(
              isLoader()&&own&&
              a.reconciliation_status==="Belum Dicocokkan"
            );

            return `
              <tr>
                <td>${dateFmt(a.activity_date)}</td>
                <td>${esc(loaderName(a.loader_id))}</td>
                <td>${a.type}</td>

function updateNumberLabel() {

  const label=document.getElementById("numberLabel");
  if(label)label.textContent=type==="INBOUND"
    ?"Nomor Mobil":"Nomor Container";
}

function applyActivityFilter() {
  actFilter.type=document.getElementById("filterType").value;
  actFilter.start=document.getElementById("filterStart").value;
  actFilter.end=document.getElementById("filterEnd").value;

  renderActivities();
}

function cancelEdit() {
  editing=null;
  renderActivities();
}

function editActivity(id,type) {
  if(type==="INBOUND") {
    const a=inbound.find(x=>x.id===id);
    if(!a)return;
    if(isLoader()&&a.loader_id!==authUser.id)return;
    editing={
      id,type,
      date:a.activity_date,
      number:a.vehicle_number,
      qty:a.total_carton,
      note:a.reconciliation_note||""
    };
  } else {
    const a=outbound.find(x=>x.id===id);
    if(!a)return;
    if(isLoader()&&a.loader_id!==authUser.id)return;
    editing={
      id,type,
      date:a.activity_date,
      number:a.container_number,
      qty:a.total_carton,
      note:a.reconciliation_note||""
    };
  }

  renderActivities();
  window.scrollTo({top:0,behavior:"smooth"});
}

async function saveActivity(event) {
  event.preventDefault();

  const date=document.getElementById("actDate").value;
  const type=document.getElementById("actType").value;
  const number=document.getElementById("actNumber").value.trim().toUpperCase();
  const qty=Number(document.getElementById("actQty").value);
  const note=document.getElementById("actNote").value.trim();

  if(!date||!number||!Number.isSafeInteger(qty)||qty<0) {
    notify("Data aktivitas tidak valid.");
    return;
  }

  const match=masterMatches(type,date,number);
  const expected=match.reduce((s,m)=>s+Number(m.total_carton),0);
  const difference=match.length?qty-expected:null;
  const status=!match.length?"Belum Dicocokkan":
    difference===0?"Sesuai":"Tidak Sesuai";

  const common={
    activity_date:date,
    total_carton:qty,
    reconciliation_status:status,
    excel_activity_date:match[0]?.activity_date||null,
    excel_total_carton:match.length?expected:null,
    carton_difference:difference,
    reconciliation_note:note||null,
    reconciled_by:match.length?authUser.id:null,
    reconciled_at:match.length?new Date().toISOString():null
  };

  let table,payload;

  if(type==="INBOUND") {
    table="inbound_activities";
    payload={
      ...common,
      vehicle_number:number,
      excel_vehicle_number:match[0]?.vehicle_number||null
    };
  } else {
    table="outbound_activities";
    payload={
      ...common,
      container_number:number,
      excel_container_number:match[0]?.container_number||null,
      excel_vehicle_number:match[0]?.vehicle_number||null
    };
  }

  try {
    if(editing) {
      const original=editing;
      let query=sb.from(table)
  .update(payload)
  .eq("id",original.id);

if(isLoader()) {
  query=query.eq("loader_id",authUser.id);
}

const result=await query.select();

      if(result.error)throw result.error;
      if(!result.data?.length) {
        throw new Error("Tidak dapat mengedit data. Periksa hak akses atau status aktivitas.");
      }
    } else {
      payload.loader_id=authUser.id;

      const result=await sb.from(table)
        .insert(payload)
        .select();

      if(result.error)throw result.error;
    }

    editing=null;
    await loadAll();
    notify("Aktivitas berhasil disimpan.");
    renderActivities();

  } catch(e) {
    console.error(e);
    notify("Gagal menyimpan: "+e.message);
  }
}

async function deleteActivity(id,type) {
  if(!confirm("Yakin ingin menghapus aktivitas ini?"))return;

  try {
    const table=type==="INBOUND"
      ?"inbound_activities":"outbound_activities";

    let query=sb.from(table).delete().eq("id",id);

    if(isLoader())
      query=query.eq("loader_id",authUser.id);

    const {data,error}=await query.select();

    if(error)throw error;
    if(!data?.length)
      throw new Error("Tidak dapat menghapus. Data mungkin sudah dikunci atau bukan milikmu.");

    await loadAll();
    notify("Aktivitas berhasil dihapus.");
    renderActivities();

  } catch(e) {
    notify("Gagal menghapus: "+e.message);
  }
}

function parseDate(value) {
  if(value===null||value===undefined||value==="")return "";

  if(typeof value==="number") {
    const d=new Date(Date.UTC(1899,11,30)+Math.floor(value)*86400000);
    return d.toISOString().slice(0,10);
  }

  const s=String(value).trim();

  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;

  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m)return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;

  const d=new Date(s);
  if(!isNaN(d)) {
    return d.getFullYear()+"-"+
      String(d.getMonth()+1).padStart(2,"0")+"-"+
      String(d.getDate()).padStart(2,"0");
  }

  return "";
}

function headerIndex(headers,aliases) {
  return headers.findIndex(h=>aliases.includes(
    String(h).toLowerCase().trim().replace(/[\s_-]+/g,"")
  ));
}

async function uploadMaster() {
  if(!isAdmin())return;

  const file=document.getElementById("masterFile").files[0];
  const mode=document.getElementById("masterMode").value;

  if(!file)return notify("Pilih file CSV terlebih dahulu.");

  try {
    const parsed=Papa.parse(await file.text(),{
      header:true,
      skipEmptyLines:true,
      transformHeader:h=>h.trim()
    });

    if(parsed.errors.length)
      throw new Error(parsed.errors[0].message);

    const rows=parsed.data;
    if(!rows.length)throw new Error("File tidak memiliki data.");

    const headers=Object.keys(rows[0]);

    const di=headerIndex(headers,["tanggal","date"]);
    const ti=headerIndex(headers,["jenis","type","aktivitas","jenisaktivitas"]);
    const ni=headerIndex(headers,["nomor","nomobil","nocontainer","referensi","nopol"]);
    const qi=headerIndex(headers,["qty","carton","qtycarton","totalcarton","totalqtycarton"]);

    if([di,ti,ni,qi].includes(-1))
      throw new Error("Header wajib: TANGGAL, JENIS, NOMOR, QTY.");

    const grouped=new Map();

    rows.forEach((row,i)=>{
      const values=Object.values(row);
      const date=parseDate(values[di]);
      const type=normalizeType(values[ti]);
      const number=String(values[ni]||"").trim().toUpperCase();
      const qty=Number(String(values[qi]??"").replace(/,/g,""));

      if(!date||!type||!number||!Number.isSafeInteger(qty)||qty<0)
        throw new Error("Data tidak valid pada baris "+(i+2));

      const key=[date,type,norm(number)].join("|");

      if(!grouped.has(key)) {
        grouped.set(key,{
          activity_date:date,
          activity_type:type,
          vehicle_number:number,
          container_number:type==="OUTBOUND"?number:null,
          total_carton:0
        });
      }

      grouped.get(key).total_carton+=qty;
    });

    const imported=[...grouped.values()];
    if(!imported.length)throw new Error("Tidak ada baris valid.");

    const start=imported.map(x=>x.activity_date).sort()[0];
    const end=imported.map(x=>x.activity_date).sort().at(-1);

    if(mode==="replace") {
      if(!confirm("Ganti master pada periode "+dateFmt(start)+" sampai "+dateFmt(end)+"?"))return;
    }

    const upload=await sb.from("excel_uploads").insert({
      file_name:file.name,
      period_start:start,
      period_end:end,
      upload_status:"Diproses",
      total_rows:imported.length,
      upload_note:"Upload melalui LoaderOPS",
      uploaded_by:authUser.id
    }).select().single();

    if(upload.error)throw upload.error;

    if(mode==="replace") {
      const del=await sb.from("excel_reference_rows")
        .delete()
        .gte("activity_date",start)
        .lte("activity_date",end);

      if(del.error)throw del.error;
    }

    const batch=imported.map(x=>({
      ...x,
      upload_id:upload.data.id
    }));

    const inserted=await sb.from("excel_reference_rows").insert(batch);

    if(inserted.error) {
      await sb.from("excel_uploads")
        .update({upload_status:"Gagal",upload_note:inserted.error.message})
        .eq("id",upload.data.id);
      throw inserted.error;
    }

    await sb.from("excel_uploads")
      .update({upload_status:"Berhasil"})
      .eq("id",upload.data.id);

    await loadAll();
    notify("Master berhasil diupload: "+imported.length+" nomor unik.");
    renderMaster();

  } catch(e) {
    console.error(e);
    notify("Upload gagal: "+e.message);
  }
}

/* ================================================
   16. EXPORT CSV
================================================ */

function downloadCSV(filename,headers,rows) {
  const cell=v=>'"'+String(v??"").replace(/"/g,'""')+'"';

  const csv="\uFEFF"+
    [headers,...rows].map(r=>r.map(cell).join(",")).join("\r\n");

  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download=filename;
  a.click();

  URL.revokeObjectURL(url);
}

function exportMaster() {
  downloadCSV(
    "loaderops_master.csv",
    ["Tanggal","Jenis","Nomor","Total Carton"],
    master.map(m=>[
      m.activity_date,
      activityType(m),
      m.activity_type==="INBOUND"?m.vehicle_number:(m.container_number||m.vehicle_number),
      m.total_carton
    ])
  );
}

function exportReport() {
  const rows=allActivities().filter(a=>
    a.activity_date>=dash.start&&
    a.activity_date<=dash.end&&
    (dash.loader==="all"||a.loader_id===dash.loader)
  );

  downloadCSV(
    "loaderops_report.csv",
    ["Tanggal","Loader","Jenis","Nomor","Qty Loader","Qty Master","Selisih","Status"],
    rows.map(a=>{
      const v=validateActivity(a.type,a);
      return [
        a.activity_date,
        loaderName(a.loader_id),
        a.type,
        a.number,
        a.total_carton,
        v.qty??"",
        v.difference??"",
        v.status
      ];
    })
  );
}
